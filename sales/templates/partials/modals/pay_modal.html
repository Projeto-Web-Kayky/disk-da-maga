<dialog id="pay-modal" class="modal">
  <div class="modal-box w-11/12 max-w-md border-green-500 bg-base-200 text-base-content">
    <h3 class="font-extrabold text-lg mb-4 text-green-700 flex items-center">
      <span class="material-symbols-outlined">attach_money</span>
      Registrar Pagamento
    </h3>

    <!-- Área de mensagem de erro -->
    <div id="pay-error-message" class="hidden alert alert-error mb-3">
      <span class="material-symbols-outlined">error</span>
      <span id="pay-error-text"></span>
    </div>

    <form hx-post="{% url 'pay_sale' sale.id %}" 
      hx-target="#sale-items" 
      hx-swap="innerHTML"
      hx-trigger="submit"
      hx-on::response-error="
        const errorDiv = document.getElementById('pay-error-message');
        const errorText = document.getElementById('pay-error-text');
        if (errorDiv && errorText && event.detail.xhr.responseText) {
          errorText.textContent = event.detail.xhr.responseText.trim();
          errorDiv.classList.remove('hidden');
          errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      "
      onsubmit="
        const amountInput = document.getElementById('pay-amount-input');
        const amount = parseFloat(amountInput.value) || 0;
        const balance = parseFloat('{{ sale.balance }}');
        if (amount > balance) {
          event.preventDefault();
          const errorDiv = document.getElementById('pay-error-message');
          const errorText = document.getElementById('pay-error-text');
          if (errorDiv && errorText) {
            errorText.textContent = 'O valor informado (R$ ' + amount.toFixed(2) + ') é maior que o saldo devido (R$ ' + balance.toFixed(2) + ').';
            errorDiv.classList.remove('hidden');
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
          return false;
        }
        return true;
      "
      method="POST" class="flex flex-col gap-3" id="pay-form">
      {% csrf_token %}
      <input type="number" 
        name="amount" 
        step="0.01" 
        required 
        placeholder="Valor a pagar" 
        class="input input-bordered"
        id="pay-amount-input"
        max="{{ sale.balance }}"
        oninput="
          const errorDiv = document.getElementById('pay-error-message');
          if (errorDiv) errorDiv.classList.add('hidden');
          const amount = parseFloat(this.value) || 0;
          const balance = parseFloat('{{ sale.balance }}');
          if (amount > balance) {
            const errorDiv = document.getElementById('pay-error-message');
            const errorText = document.getElementById('pay-error-text');
            if (errorDiv && errorText) {
              errorText.textContent = 'O valor informado (R$ ' + amount.toFixed(2) + ') é maior que o saldo devido (R$ ' + balance.toFixed(2) + ').';
              errorDiv.classList.remove('hidden');
            }
          }
        ">
      <select name="method" class="select select-bordered">
        <option value="pix">PIX</option>
        <option value="cash">Dinheiro</option>
        <option value="card">Cartão</option>
        <option value="fiado">Conta do Cliente</option>
      </select>
      <input type="text" name="note" placeholder="Observação (opcional)" class="input input-bordered">

      <div class="flex justify-between items-center gap-2 mt-2">
        <h3 class="font-extrabold text-lg text-green-700">
          Saldo: R$ {{ sale.balance }}
        </h3>
        <div class="flex gap-2">
          <button type="button" class="btn btn-outline btn-error"
            onclick="document.getElementById('pay-modal').close()">Cancelar</button>
          <button type="submit" class="btn btn-success text-white">Registrar</button>
        </div>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>Fechar</button></form>
</dialog>
